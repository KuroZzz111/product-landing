    <!-- Product Section -->
<section id="product" class="container py-5">

        <!-- Judul Section -->
    <div class="text-center mb-4">
        <h2 class="fw-bold">Product</h2>
    </div>

        <!-- Grid System -->
    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm h-100">

                <!-- Gambar Produk -->

                    src="https://plus.unsplash.com/premium_photo-1681711647066-ef84575c0d95?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Zm90byUyMHByb2R1a3xlbnwwfHwwfHx8MA%3D%3D"
                    class="card-img-top" 
                    alt="Glass Cup"
                >

                <!-- Isi Card -->
                <div class="card-body">

                    <h5 class="card-title fw-bold">
                        Premium Glass Cup
                    </h5>

                    <p class="card-text text-secondary">
                        Nikmati Minum favorit anda dengan lebih elegan menggunakan Premium Glass Cup.
                    </p>

                    <div class="d-flex justify-content-between align-items-center">

                        <h5 class="fw-bold mb-0">

                        </h5>

                        Tanya Produk
                        </a>

                    </div>

                </div>
            </div>

        </div>

</section>

    <!-- Kontak -->
    <div id="kontak" class="bg-light py-5">
    <div class="container">
        <h2 class="text-center mb-4"> Kontak Saya</h2>
        <!-- Formulir -->
        <form id="form-kontak" class="bg-white p-4 rounded shadow-sm mx-auto" style="max-width:500px;">
            <!-- Input Nama -->
            <div class="mb-3">
             <label for="input-nama" class="form-label">Nama</label>
            <textarea class="form-control" id="input-pesan" rows="3" required></textarea>
        </div>
        <!-- Input Pesan -->
        <div class="mb-3">
            <label for="input-pesan" class="form-label">Pesan</label>
            <textarea class="form-control" id="input-pesan" rows="3"></textarea>
            </div>
            <!-- Button Submit -->
            <button type="submit" class="btn btn-primary">Kirim Pesan</button>

            
        </form>
    </div>
</div>

    <!-- Footer -->
    <footer class="bg-white text-dark text-center py-4">

    </footer>

    
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const formKontak = document.getElementById("form-kontak");

    formKontak.addEventListener("submit", function(event) {
        event.preventDefault();

        Swal.fire({
            title: "Pesan berhasil dikirim!",
            text: "Terima kasih telah menghubungi kami.",
            icon: "success",
            draggable: true,
            confirmButtonText: "Oke"
        }).then(() => {
            formKontak.reset();
        });
    });
</script>
